<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeless — Investor Grade Demo · October 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: radial-gradient(circle at top, #e8ddff 0%, #f5f7fb 34%, #e8edf6 100%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    button { cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/plain" id="timeless-jsx">
const { useState } = React;
const THETA_EUR = 0.50;
const feeRate = mode => mode === "premium" ? 0.12 : mode === "fiat" ? 0.15 : 0.08;
const money = v => Number(v).toFixed(2).replace(".", ",");

const people = [
  {name:'Giulia Bianchi', avatar:'G', role:'Business English Mentor', offers:'Business English', wants:'Financial Markets', match:96, trust:94, rating:4.9, reviews:187, badge:'Expert', price:'60 Θ / 60 min', fee:'Theta Standard 8%', verified:['ID','University','LinkedIn','Skills'], skills:['Business English','CV Review','Public Speaking'], stats:{done:312, completion:'99.2%', response:'1h'}, quote:'Sessione molto concreta, perfetta per preparare interview e presentation.'},
  {name:'Luca Ferrari', avatar:'L', role:'Excel & Coding Tutor', offers:'Excel e Python', wants:'Business English', match:91, trust:91, rating:4.8, reviews:121, badge:'Trusted', price:'60 Θ / 60 min', fee:'Theta Standard 8%', verified:['ID','Phone','Portfolio'], skills:['Excel','Python','Data Analysis'], stats:{done:198, completion:'97.8%', response:'2h'}, quote:'Mi ha aiutato a trasformare un concept in prototipo cliccabile.'},
  {name:'Sara Conti', avatar:'S', role:'Career & Interview Mentor', offers:'Interview preparation', wants:'Python', match:88, trust:88, rating:4.7, reviews:86, badge:'Trusted', price:'100 Θ / 60 min', fee:'Theta Premium 12%', verified:['ID','University'], skills:['Mock interviews','CV Review','Career coaching'], stats:{done:144, completion:'96.4%', response:'3h'}, quote:'Simulazioni di colloquio con feedback personalizzato.'}
];
const me = {trust:92, rating:4.9, reviews:74, theta:'128 Θ', badge:'Expert Member'};
const conversations = [
  {name:'Giulia Bianchi', avatar:'G', last:'Confermo slot mercoledì 18:00. Chat sbloccata dopo booking.', unread:2, trust:94, time:'2 min'},
  {name:'Luca Ferrari', avatar:'L', last:'Ho caricato materiali e agenda nello scambio.', unread:1, trust:91, time:'1h'},
  {name:'Sara Conti', avatar:'S', last:'Grazie per la review!', unread:0, trust:88, time:'ieri'}
];

function Stars(){ return <span className="text-amber-400 tracking-[-1px]">★★★★★</span> }
function Logo({small=false}){ return <img src="timeless-logo-definitive.png" className={small?'w-[158px] h-auto':'w-[275px] h-auto mx-auto'} /> }
function Theta({small=false}){ return <img src="theta-logo-definitive.png" className={small?'w-7 h-7 object-contain':'w-32 h-auto mx-auto object-contain'} /> }
function Pill({children,tone='violet'}){ const map={violet:'bg-violet-50 text-violet-700',green:'bg-emerald-50 text-emerald-700',amber:'bg-amber-50 text-amber-700',blue:'bg-blue-50 text-blue-700',dark:'bg-slate-900 text-white'}; return <span className={'inline-flex rounded-full px-2.5 py-1 text-[11px] font-semibold '+map[tone]}>{children}</span> }
function Card({children, className=''}){ return <div className={'bg-white rounded-3xl p-4 shadow-sm border border-slate-100 '+className}>{children}</div> }
function Back({title,setScreen}){ return <div className="px-5 py-3 flex items-center justify-between"><button onClick={()=>setScreen('home')} className="w-10 h-10 rounded-2xl bg-white border shadow-sm">←</button><b>{title}</b><span className="text-slate-400">●●●</span></div> }
function TrustLine({p}){ return <div className="flex flex-wrap gap-2 items-center"><Pill tone="green">Trust {p.trust}/100</Pill><Pill tone="amber">🏆 {p.badge}</Pill><span className="text-xs text-slate-500"><Stars/> {p.rating} ({p.reviews})</span></div> }

function Shell({screen,setScreen,children}){
 const hide=screen==='splash'||screen==='detail'||screen==='booking'||screen==='review'||screen==='chat';
 const nav=[['home','⌂','Home'],['match','◇','Match'],['bookings','⇄','Booking'],['messages','💬','Chat'],['wallet','Θ','Wallet']];
 return <div className="min-h-screen flex items-center justify-center p-4">
  <div className="w-[390px] h-[820px] max-w-[96vw] max-h-[94vh] bg-black rounded-[48px] p-[10px] shadow-2xl">
   <div className="h-full bg-[#fbfbfd] rounded-[40px] overflow-hidden flex flex-col">
    <div className="h-8 px-7 flex items-center justify-between text-[11px] font-semibold"><span>TIMELESS v8</span><span className="text-amber-700">● DEMO SIMULATA</span></div>
    <main className="flex-1 overflow-y-auto">{children}</main>
    {!hide && <div className="h-[78px] bg-white border-t grid grid-cols-5 text-[10px] px-1">
     {nav.map(([id,icon,label])=><button key={id} onClick={()=>setScreen(id)} className={(screen===id?'text-violet-600':'text-slate-500')+' relative flex flex-col items-center justify-center gap-1'}>
       <div className={id==='messages'?'text-xl w-11 h-11 -mt-5 rounded-full bg-violet-600 text-white flex items-center justify-center shadow-lg':'text-lg'}>{icon}</div>
       {id==='messages' && <span className="absolute top-1 right-5 min-w-[18px] h-[18px] rounded-full bg-rose-500 text-white text-[10px] flex items-center justify-center border-2 border-white">3</span>}
       <span className={id==='messages'?'font-semibold text-violet-600':''}>{label}</span>
      </button>)}
    </div>}
   </div>
  </div>
 </div>
}

function Header({setScreen}){ return <div className="px-5 py-3 flex items-center justify-between"><button onClick={()=>setScreen('home')}><Logo small/></button><button onClick={()=>setScreen('profile')} className="w-10 h-10 rounded-full bg-slate-900 text-white text-xs">GM</button></div> }

function Splash({setScreen}){ return <div className="h-full flex flex-col justify-between px-8 py-10 text-center"><div className="text-xs tracking-widest text-violet-700 font-bold">INVESTOR GRADE • OCT 2026</div><div><Logo/><p className="mt-8 text-xl font-semibold text-slate-900">Human Capital. Exchanged Intelligently.</p><p className="mt-3 text-sm text-slate-500">Academic & Career Skills Exchange: trova persone, scambia competenze, guadagna Theta.</p><div className="mt-6 grid grid-cols-3 gap-2 text-[11px]"><Pill>AI Match demo</Pill><Pill tone="green">Theta Wallet</Pill><Pill tone="amber">Trust</Pill></div><p className="text-xs mt-6 text-slate-400">Tutti i profili, i saldi e le operazioni sono dati dimostrativi. Nessun pagamento reale.</p></div><button onClick={()=>setScreen('home')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Esplora Timeless →</button></div> }

function Home({setScreen,setPerson}){ return <><Header setScreen={setScreen}/><div className="px-5 pb-5"><div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#4d1b88] to-[#ff6b1a] p-5 text-white shadow-xl"><p className="text-xs text-white/70">MILANO • UNIVERSITY PILOT</p><h1 className="text-2xl font-semibold mt-1">Academic & Career Skills Exchange</h1><p className="text-sm text-white/80 mt-2">Impara, insegna e cresci. Uno stesso utente può essere learner e provider.</p><div className="grid grid-cols-3 gap-2 mt-4"><div className="bg-white/10 rounded-2xl p-3"><p className="text-[10px] text-white/65">Wallet demo</p><b>128 Θ</b></div><div className="bg-white/10 rounded-2xl p-3"><p className="text-[10px] text-white/65">Trust</p><b>92/100</b></div><div className="bg-white/10 rounded-2xl p-3"><p className="text-[10px] text-white/65">Valore rif.</p><b>€0,50/Θ</b></div></div><button onClick={()=>setScreen('match')} className="mt-4 bg-white text-slate-900 rounded-2xl px-4 py-3 text-sm font-semibold">Scopri competenze →</button></div><div className="grid grid-cols-4 gap-3 mt-5">{[['onboarding','✓','Verifica'],['match','◇','Matching'],['bookings','🔒','Scambi'],['wallet','Θ','Wallet']].map(([id,icon,label])=><button key={id} onClick={()=>setScreen(id)} className="bg-white rounded-2xl p-3 h-[82px] shadow-sm"><div className="text-2xl text-violet-600">{icon}</div><span className="text-[11px]">{label}</span></button>)}</div><Card className="mt-4 bg-violet-50"><b>Come funziona Theta?</b><p className="text-sm mt-1 text-slate-600">1 Θ = 1 minuto • 60 Θ = €30 di riferimento. Guadagna Theta offrendo competenze, spendili per imparare. Valore fisso, non criptovaluta.</p><button onClick={()=>setScreen('wallet')} className="text-sm text-violet-700 font-bold mt-2">Scopri l'economia Theta →</button></Card><h3 className="mt-6 mb-3 font-semibold">Competenze disponibili · demo</h3><div className="space-y-3">{people.map(p=><PersonCard key={p.name} p={p} onClick={()=>{setPerson(p);setScreen('detail')}} />)}</div></div></> }

function PersonCard({p,onClick}){ return <button onClick={onClick} className="w-full bg-white rounded-3xl p-4 shadow-sm text-left border border-slate-100"><div className="flex gap-3"><div className="w-14 h-14 rounded-2xl bg-violet-100 flex items-center justify-center font-bold text-violet-800">{p.avatar}</div><div className="flex-1 min-w-0"><div className="flex justify-between"><b>{p.name}</b><span className="text-emerald-600 text-sm font-bold">{p.match}%</span></div><p className="text-sm text-slate-500">{p.role}</p><p className="text-xs text-slate-500 mt-1">Offre {p.offers} • Cerca {p.wants}</p><div className="mt-2"><TrustLine p={p}/></div><div className="mt-2 flex justify-between"><b className="text-amber-700 text-sm">{p.price}</b><span className="text-xs text-slate-400">{p.fee}</span></div></div></div></button> }

function Onboarding({setScreen}){ return <><Back title="Verification" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><h2 className="text-xl font-semibold">Trust & Verification · Demo</h2><p className="text-sm text-slate-500 mt-2">Il business plan prevede verifica identità, competenze e segnali antifrode prima di scalare il marketplace.</p></Card>{['Email & phone verification','University / student status','Identity document','LinkedIn / portfolio','Skill verification test'].map((x,i)=><Card key={x}><div className="flex justify-between"><b>{x}</b><Pill tone={i<3?'green':'blue'}>{i<3?'Demo':'Futuro'}</Pill></div></Card>)}<button onClick={()=>setScreen('match')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Continue to AI Match</button></div></> }
function Match({setScreen,setPerson}){ const [query,setQuery]=useState('');const [category,setCategory]=useState('Tutte');const filtered=people.filter(p=>(category==='Tutte'||(category==='Career'?/English|Interview|Career/i.test(p.offers):/Excel|Python/i.test(p.offers)))&&[p.name,p.offers,p.wants,p.skills.join(' ')].join(' ').toLowerCase().includes(query.toLowerCase()));return <><Back title="Skill Discovery" setScreen={setScreen}/><div className="px-5 pb-5 space-y-3"><Card className="bg-violet-50"><b>Theta Match · anteprima</b><p className="text-sm text-slate-600 mt-1">Compatibilità indicativa basata su skill, obiettivi e trust. Ranking dimostrativo, non AI reale.</p></Card><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Cerca Excel, English, interview..." className="w-full p-3 rounded-2xl border text-sm"/><div className="flex gap-2">{['Tutte','Career','Tech'].map(c=><button key={c} onClick={()=>setCategory(c)} className={'px-4 py-2 rounded-full text-xs font-bold '+(category===c?'bg-violet-600 text-white':'bg-white border')}>{c}</button>)}</div>{filtered.length?filtered.map(p=><PersonCard key={p.name} p={p} onClick={()=>{setPerson(p);setScreen('detail')}}/>):<Card>Nessun match nella demo per questa ricerca.</Card>}</div></> }

function Detail({person,setScreen}){ return <><Back title="Skill profile" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><div className="flex gap-4"><div className="w-20 h-20 rounded-3xl bg-violet-100 flex items-center justify-center text-3xl font-bold text-violet-800">{person.avatar}</div><div><h2 className="text-2xl font-semibold">{person.name}</h2><p className="text-slate-500">{person.role}</p><div className="mt-2"><TrustLine p={person}/></div></div></div><p className="mt-4 text-sm text-slate-600">{person.quote}</p></Card><Card><b>Segnali di verifica · demo</b><div className="mt-3 flex flex-wrap gap-2">{person.verified.map(v=><Pill key={v} tone="green">✓ {v}</Pill>)}</div></Card><Card><b>Affidabilità</b><div className="grid grid-cols-3 gap-2 mt-3 text-center"><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.done}</b><p className="text-[10px] text-slate-500">scambi</p></div><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.completion}</b><p className="text-[10px] text-slate-500">completion</p></div><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.response}</b><p className="text-[10px] text-slate-500">response</p></div></div></Card><Card><b>Competenze</b><div className="mt-3 flex flex-wrap gap-2">{person.skills.map(x=><Pill key={x}>{x}</Pill>)}</div></Card><Card className="bg-amber-50"><b>Regola comunicazioni</b><p className="text-sm mt-1">Chat disponibile solo dopo booking confermato.</p></Card><button onClick={()=>setScreen('booking')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Prenota una sessione →</button></div></> }

function Booking({person,setScreen,setBooked,setTransaction}){const [mode,setMode]=useState('standard');const [minutes,setMinutes]=useState(60);const [slot,setSlot]=useState('Mercoledì · 18:00');const theta=mode==='premium'?Math.round(minutes*100/60):minutes;const base=mode==='fiat'?minutes*THETA_EUR:theta;const fee=base*feeRate(mode);const total=base+fee;return <><Back title="Booking & fees" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><b>{person.name}</b><p className="text-sm text-slate-500">{person.offers} · Trust {person.trust}/100</p></Card><Card><b>Durata</b><div className="grid grid-cols-3 gap-2 mt-3">{[30,45,60].map(m=><button key={m} onClick={()=>setMinutes(m)} className={'rounded-xl p-3 text-sm font-semibold border '+(minutes===m?'border-violet-600 bg-violet-50':'')}>{m} min</button>)}</div><b className="block mt-4">Disponibilità · demo</b><div className="grid grid-cols-2 gap-2 mt-2">{['Mercoledì · 18:00','Giovedì · 12:30'].map(x=><button key={x} onClick={()=>setSlot(x)} className={'rounded-xl p-3 text-xs border '+(slot===x?'border-violet-600 bg-violet-50':'')}>{x}</button>)}</div></Card><Card><b>Modalità di scambio</b><div className="space-y-2 mt-3">{[['standard','Theta Standard · 8%'],['premium','Theta Premium · 12%'],['fiat','Euro · 15%']].map(([id,label])=><button key={id} onClick={()=>setMode(id)} className={'w-full text-left rounded-xl border p-3 text-sm '+(mode===id?'border-violet-600 bg-violet-50 font-bold':'')}>{mode===id?'◉':'○'} {label}</button>)}</div></Card><Card className="bg-slate-50"><b>Riepilogo economico</b><div className="flex justify-between text-sm mt-3"><span>Valore sessione</span><b>{mode==='fiat'?'€'+money(base):theta+' Θ'}</b></div><div className="flex justify-between text-sm mt-2"><span>Fee piattaforma ({Math.round(feeRate(mode)*100)}%)</span><b>{mode==='fiat'?'€'+money(fee):money(fee)+' Θ'}</b></div><div className="flex justify-between border-t mt-3 pt-3"><b>Totale illustrativo</b><b>{mode==='fiat'?'€'+money(total):money(total)+' Θ'}</b></div><p className="text-xs text-slate-500 mt-3">Valore di riferimento: 1 Θ = 1 minuto = €0,50. Le commissioni sono illustrate come addebito aggiuntivo al learner per finalità dimostrative; il business plan non definisce qui la ripartizione contrattuale definitiva.</p></Card><Card className="bg-amber-50"><b>Escrow simulato</b><p className="text-sm text-amber-800 mt-1">Nessun saldo reale bloccato e nessun pagamento eseguito. Il flusso mostra cosa avverrà dopo l'integrazione regolamentata.</p></Card><button onClick={()=>{setTransaction({person,mode,minutes,slot,theta,base,fee,total,status:'booked'});setBooked(true);setScreen('chat')}} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Conferma prenotazione demo →</button></div></> }

function Bookings({setScreen,transaction}){return <><Back title="I miei scambi" setScreen={setScreen}/><div className="px-5 pb-5 space-y-3"><Card className="bg-violet-50"><b>Journey Timeless</b><p className="text-sm mt-2">Discovery → Matching → Booking → Escrow → Sessione → Review → Trust</p></Card>{transaction?<Card><div className="flex justify-between"><b>{transaction.person.offers}</b><Pill tone="green">{transaction.status==='completed'?'Completato':'Prenotato'}</Pill></div><p className="text-sm mt-2">{transaction.person.name} · {transaction.minutes} minuti</p><p className="text-xs text-slate-500 mt-1">{transaction.slot} · {transaction.mode==='fiat'?'€'+money(transaction.total):money(transaction.total)+' Θ'} · Demo</p><button onClick={()=>setScreen(transaction.status==='completed'?'reputation':'chat')} className="text-violet-700 font-semibold mt-3">{transaction.status==='completed'?'Vedi Trust Score':'Apri chat →'}</button></Card>:<Card><b>Nessuna prenotazione demo attiva</b><p className="text-sm text-slate-500 mt-2">Seleziona una competenza e conferma un booking per vedere il flusso completo.</p></Card>}<button onClick={()=>setScreen('match')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Trova una competenza</button></div></> }

function Messages({setScreen,transaction}){return <><Back title="Messaggi" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card className="bg-violet-50"><b>Chat controllata</b><p className="text-sm text-slate-600 mt-1">La chat si abilita dopo una prenotazione confermata, non durante la ricerca.</p></Card>{transaction?<button onClick={()=>setScreen('chat')} className="w-full bg-white rounded-3xl p-4 text-left border"><b>{transaction.person.name}</b><p className="text-sm text-slate-500 mt-1">Booking demo confermato · Apri conversazione →</p></button>:<Card><b>Chat bloccata</b><p className="text-sm text-slate-500 mt-2">Prenota una sessione per attivare la conversazione.</p><button onClick={()=>setScreen('match')} className="mt-3 text-violet-700 font-semibold">Vai al marketplace →</button></Card>}</div></> }

function Chat({setScreen,transaction}){const [msg,setMsg]=useState('');const [messages,setMessages]=useState([]);if(!transaction)return <><Back title="Chat" setScreen={setScreen}/><div className="p-5"><Card>Per aprire la chat devi prima confermare un booking demo.<button onClick={()=>setScreen('match')} className="block text-violet-700 mt-3 font-bold">Trova competenze →</button></Card></div></>;return <><Back title={transaction.person.name} setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><b>{transaction.person.offers}</b><p className="text-xs text-slate-500">{transaction.slot} · {transaction.minutes} min · {transaction.status==='completed'?'Completato':'Escrow simulato'}</p></Card><Card><p className="rounded-2xl bg-slate-100 p-3 text-sm">Ciao! Grazie per la prenotazione. Prepariamo insieme la sessione.</p>{messages.map((m,i)=><p key={i} className="rounded-2xl bg-violet-600 text-white p-3 text-sm mt-2 ml-auto max-w-[85%]">{m}</p>)}<div className="flex gap-2 mt-4"><input value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Scrivi un messaggio demo" className="min-w-0 flex-1 border rounded-xl p-2 text-sm"/><button onClick={()=>{if(msg.trim()){setMessages([...messages,msg.trim()]);setMsg('')}}} className="bg-violet-600 text-white rounded-xl px-3">Invia</button></div><p className="text-xs text-slate-400 mt-2">Messaggi solo in memoria: non vengono inviati realmente.</p></Card>{transaction.status!=='completed'&&<button onClick={()=>setScreen('review')} className="w-full py-4 rounded-2xl bg-amber-500 text-white font-semibold">Completa sessione e valuta →</button>}</div></> }

function Wallet({setScreen,transaction}){return <><Back title="Theta Wallet" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#3f1c8b] to-[#28145e] p-6 text-white text-center"><div className="bg-white rounded-3xl px-3 py-2 inline-block"><Theta/></div><p className="text-sm text-white/70 mt-4">Saldo dimostrativo</p><h1 className="text-4xl font-bold text-amber-400">128 Θ</h1><p className="text-xs text-white/70 mt-2">128 minuti · €64,00 valore di riferimento</p></div><Card><b>Regole Theta</b><p className="text-sm text-slate-600 mt-2">1 Θ = 1 minuto = €0,50 di riferimento fisso. 60 Θ = €30. Non è una criptovaluta.</p><div className="grid grid-cols-3 gap-2 mt-4 text-center text-xs">{[['Standard','8%'],['Premium','12%'],['Fiat','15%']].map(([a,b])=><div key={a} className="bg-violet-50 rounded-xl p-2"><b>{b}</b><p>{a}</p></div>)}</div></Card><Card><b>Movimenti dimostrativi</b>{[['+60 Θ','Sessione Excel erogata'],['−4,8 Θ','Commissione standard 8%'],['−30 Θ','Sessione Career acquistata']].map(([a,b])=><div key={b} className="flex justify-between gap-3 py-3 border-b last:border-0"><span className="text-sm text-slate-600">{b}</span><b className="text-sm whitespace-nowrap">{a}</b></div>)}{transaction&&<div className="mt-3 rounded-xl bg-amber-50 p-3 text-sm">Prenotazione {transaction.status==='completed'?'completata':'confermata'}: {transaction.mode==='fiat'?'€'+money(transaction.total):money(transaction.total)+' Θ'} · nessun movimento reale</div>}</Card><Card className="bg-amber-50"><b>Acquisto / prelievo Theta</b><p className="text-sm text-slate-600 mt-2">Non attivi nella demo. Saranno valutati dopo le verifiche normative, fiscali e sui pagamenti.</p></Card></div></> }

function Reputation({setScreen}){ return <><Back title="Trust Score" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#3f1c8b] to-[#28145e] p-6 text-white text-center"><p className="text-sm text-white/70">Timeless Trust Score</p><div className="mx-auto mt-4 w-36 h-36 rounded-full border-[12px] border-white/20 flex items-center justify-center"><span className="text-4xl font-bold text-amber-400">92</span></div><p className="mt-3"><Stars/> 4.9 (74 reviews)</p><Pill tone="amber">🏆 Expert Member</Pill></div><Card><b>Score breakdown</b>{[['Rating utenti','38/40'],['Storico scambi','24/25'],['Affidabilità','23/25'],['Verifiche','7/10']].map(([a,b])=><div key={a} className="flex justify-between border-b last:border-b-0 py-3 text-sm"><span>{a}</span><b>{b}</b></div>)}</Card></div></> }
function Review({setScreen,setTransaction,transaction}){const [stars,setStars]=useState(5);const [comment,setComment]=useState('');return <><Back title="Review & release" setScreen={setScreen}/><div className="px-5 pb-5"><Card><h2 className="text-xl font-semibold">Come è andata la sessione?</h2><p className="text-sm text-slate-500 mt-1">Feedback dimostrativo: contribuisce al Trust Score e al ranking.</p><div className="flex gap-2 mt-5">{[1,2,3,4,5].map(n=><button key={n} onClick={()=>setStars(n)} className={'text-3xl '+(n<=stars?'text-amber-500':'text-slate-300')}>★</button>)}</div><textarea value={comment} onChange={e=>setComment(e.target.value)} className="w-full mt-5 rounded-2xl border p-3 text-sm" rows="4" placeholder="Scrivi una recensione..."/><button onClick={()=>{if(transaction)setTransaction({...transaction,status:'completed',rating:stars,comment});setScreen('bookings')}} className="w-full mt-4 py-4 rounded-2xl bg-violet-600 text-white font-semibold">Invia review e simula release →</button><p className="text-xs text-slate-400 mt-3">Nessun escrow reale viene rilasciato.</p></Card></div></> }

function App(){const [screen,setScreen]=useState('splash');const [person,setPerson]=useState(people[0]);const [booked,setBooked]=useState(false);const [transaction,setTransaction]=useState(null);let page;if(screen==='splash')page=<Splash setScreen={setScreen}/>;else if(screen==='home')page=<Home setScreen={setScreen} setPerson={setPerson}/>;else if(screen==='onboarding')page=<Onboarding setScreen={setScreen}/>;else if(screen==='match')page=<Match setScreen={setScreen} setPerson={setPerson}/>;else if(screen==='detail')page=<Detail person={person} setScreen={setScreen}/>;else if(screen==='booking')page=<Booking person={person} setScreen={setScreen} setBooked={setBooked} setTransaction={setTransaction}/>;else if(screen==='bookings')page=<Bookings setScreen={setScreen} transaction={transaction}/>;else if(screen==='messages')page=<Messages setScreen={setScreen} transaction={transaction}/>;else if(screen==='chat')page=<Chat setScreen={setScreen} transaction={transaction}/>;else if(screen==='wallet')page=<Wallet setScreen={setScreen} transaction={transaction}/>;else if(screen==='reputation')page=<Reputation setScreen={setScreen}/>;else if(screen==='review')page=<Review setScreen={setScreen} transaction={transaction} setTransaction={setTransaction}/>;else page=<Profile setScreen={setScreen}/>;return <Shell screen={screen} setScreen={setScreen}>{page}</Shell>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  <script>

          throw new Error('Una libreria necessaria (React, ReactDOM o Babel) non è stata caricata.');
        }
        var source = document.getElementById('timeless-jsx').textContent;
        var compiled = Babel.transform(source, {
          presets: [['react', {runtime: 'classic'}]],
          sourceType: 'script'
        }).code;
        (0, eval)(compiled);
      } catch (error) {
        console.error('Timeless startup error:', error);
        root.innerHTML = '<div style="margin:40px auto;padding:24px;max-width:600px;background:white;border-radius:16px;font-family:system-ui;color:#8b1c1c"><h2>Timeless non è riuscito ad avviarsi</h2><p>Apri la Console (F12) per vedere il dettaglio tecnico.</p><pre style="white-space:pre-wrap"></pre></div>';
        root.querySelector('pre').textContent = String(error);
      }
    })();
