<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeless — Business Plan Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: radial-gradient(circle at top, #e8ddff 0%, #f5f7fb 34%, #e8edf6 100%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    button { cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState } = React;

const people = [
  {name:'Giulia Bianchi', avatar:'G', role:'Business English Mentor', offers:'Business English', wants:'Financial Markets', match:96, trust:94, rating:4.9, reviews:187, badge:'Expert', price:'45 Θ / 45 min', fee:'Marketplace fee 8%', verified:['ID','University','LinkedIn','Skills'], skills:['Business English','CV Review','Public Speaking'], stats:{done:312, completion:'99.2%', response:'1h'}, quote:'Sessione molto concreta, perfetta per preparare interview e presentation.'},
  {name:'Luca Ferrari', avatar:'L', role:'No-code Builder', offers:'Landing page & Webflow', wants:'Fotografia', match:91, trust:91, rating:4.8, reviews:121, badge:'Trusted', price:'60 Θ / 60 min', fee:'1h ↔ 1h + fee', verified:['ID','Phone','Portfolio'], skills:['Figma','Webflow','Landing Page'], stats:{done:198, completion:'97.8%', response:'2h'}, quote:'Mi ha aiutato a trasformare un concept in prototipo cliccabile.'},
  {name:'Sara Conti', avatar:'S', role:'Yoga & Wellbeing Coach', offers:'Yoga', wants:'Finance basics', match:88, trust:88, rating:4.7, reviews:86, badge:'Trusted', price:'30 Θ / 30 min', fee:'Hybrid Theta / fiat', verified:['ID','Phone'], skills:['Yoga','Breathing','Posture'], stats:{done:144, completion:'96.4%', response:'3h'}, quote:'Molto empatica, ottima gestione del tempo.'}
];
const me = {trust:92, rating:4.9, reviews:74, theta:'128 Θ', badge:'Expert Member'};
const conversations = [
  {name:'Giulia Bianchi', avatar:'G', last:'Confermo slot mercoledì 18:00. Chat sbloccata dopo booking.', unread:2, trust:94, time:'2 min'},
  {name:'Luca Ferrari', avatar:'L', last:'Ho caricato materiali e agenda nello scambio.', unread:1, trust:91, time:'1h'},
  {name:'Sara Conti', avatar:'S', last:'Grazie per la review!', unread:0, trust:88, time:'ieri'}
];

function Stars(){ return <span className="text-amber-400 tracking-[-1px]">★★★★★</span> }
function Logo({small=false}){ return <img src="timeless-logo-definitive.png" className={small?'w-[158px] h-auto':'w-[275px] h-auto mx-auto'} /> }
function Theta({small=false}){ return <img src="theta-logo-definitive.png" className={small?'w-7 h-7 object-contain':'w-32 h-auto mx-auto object-contain'} /> }
function Pill({children,tone='violet'}){ const map={violet:'bg-violet-50 text-violet-700',green:'bg-emerald-50 text-emerald-700',amber:'bg-amber-50 text-amber-700',blue:'bg-blue-50 text-blue-700',dark:'bg-slate-900 text-white'}; return <span className={'inline-flex rounded-full px-2.5 py-1 text-[11px] font-semibold '+map[tone]}>{children}</span> }
function Card({children, className=''}){ return <div className={'bg-white rounded-3xl p-4 shadow-sm border border-slate-100 '+className}>{children}</div> }
function Back({title,setScreen}){ return <div className="px-5 py-3 flex items-center justify-between"><button onClick={()=>setScreen('home')} className="w-10 h-10 rounded-2xl bg-white border shadow-sm">←</button><b>{title}</b><span className="text-slate-400">●●●</span></div> }
function TrustLine({p}){ return <div className="flex flex-wrap gap-2 items-center"><Pill tone="green">Trust {p.trust}/100</Pill><Pill tone="amber">🏆 {p.badge}</Pill><span className="text-xs text-slate-500"><Stars/> {p.rating} ({p.reviews})</span></div> }

function Shell({screen,setScreen,children}){
 const hide=screen==='splash'||screen==='detail'||screen==='booking'||screen==='review'||screen==='chat';
 const nav=[['home','⌂','Home'],['match','◇','Match'],['bookings','⇄','Booking'],['messages','💬','Chat'],['wallet','Θ','Wallet']];
 return <div className="min-h-screen flex items-center justify-center p-4">
  <div className="w-[390px] h-[820px] max-w-[96vw] max-h-[94vh] bg-black rounded-[48px] p-[10px] shadow-2xl">
   <div className="h-full bg-[#fbfbfd] rounded-[40px] overflow-hidden flex flex-col">
    <div className="h-8 px-7 flex items-center justify-between text-[11px] font-semibold"><span>9:41</span><span>5G 🔋</span></div>
    <main className="flex-1 overflow-y-auto">{children}</main>
    {!hide && <div className="h-[78px] bg-white border-t grid grid-cols-5 text-[10px] px-1">
     {nav.map(([id,icon,label])=><button key={id} onClick={()=>setScreen(id)} className={(screen===id?'text-violet-600':'text-slate-500')+' relative flex flex-col items-center justify-center gap-1'}>
       <div className={id==='messages'?'text-xl w-11 h-11 -mt-5 rounded-full bg-violet-600 text-white flex items-center justify-center shadow-lg':'text-lg'}>{icon}</div>
       {id==='messages' && <span className="absolute top-1 right-5 min-w-[18px] h-[18px] rounded-full bg-rose-500 text-white text-[10px] flex items-center justify-center border-2 border-white">3</span>}
       <span className={id==='messages'?'font-semibold text-violet-600':''}>{label}</span>
      </button>)}
    </div>}
   </div>
  </div>
 </div>
}

function Header({setScreen}){ return <div className="px-5 py-3 flex items-center justify-between"><button onClick={()=>setScreen('home')}><Logo small/></button><button onClick={()=>setScreen('profile')} className="w-10 h-10 rounded-full bg-slate-900 text-white text-xs">GM</button></div> }

function Splash({setScreen}){ return <div className="h-full flex flex-col justify-between px-8 py-10 text-center"><div/><div><Logo/><p className="mt-8 text-xl font-semibold text-slate-900">The Human Capital Exchange</p><p className="mt-3 text-sm text-slate-500">Scambia tempo, competenze e opportunità con Theta, escrow e reputazione verificata.</p><div className="mt-6 grid grid-cols-3 gap-2 text-[11px]"><Pill>AI Match</Pill><Pill tone="green">Escrow</Pill><Pill tone="amber">Trust</Pill></div></div><button onClick={()=>setScreen('home')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Apri demo</button></div> }

function Home({setScreen,setPerson}){ return <><Header setScreen={setScreen}/><div className="px-5 pb-5">
 <div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#4d1b88] to-[#ff6b1a] p-5 text-white shadow-xl">
  <p className="text-xs text-white/70">Student launch segment</p><h1 className="text-2xl font-semibold mt-1">Academic & Career Skills Exchange</h1><p className="text-sm text-white/80 mt-2">Target iniziale: studenti universitari che scambiano competenze accademiche, career coaching e skill pratiche.</p>
  <div className="grid grid-cols-3 gap-2 mt-4"><div className="bg-white/12 rounded-2xl p-3"><p className="text-[10px] text-white/65">Saldo</p><b>{me.theta}</b></div><div className="bg-white/12 rounded-2xl p-3"><p className="text-[10px] text-white/65">Trust</p><b>{me.trust}/100</b></div><div className="bg-white/12 rounded-2xl p-3"><p className="text-[10px] text-white/65">Rating</p><b>{me.rating}</b></div></div>
  <button onClick={()=>setScreen('match')} className="mt-4 bg-white text-slate-900 rounded-2xl px-4 py-3 text-sm font-semibold">Trova un match AI →</button>
 </div>
 <div className="grid grid-cols-4 gap-3 mt-5">{[['onboarding','✓','Verify'],['match','◇','Match'],['booking','🔒','Escrow'],['wallet','Θ','Wallet']].map(([s,i,l])=><button key={s} onClick={()=>setScreen(s)} className="bg-white rounded-2xl p-3 h-[82px] shadow-sm"><div className="text-2xl text-violet-600">{i}</div><span className="text-[11px]">{l}</span></button>)}</div>
 <h3 className="mt-6 mb-3 font-semibold">Best AI matches</h3>
 <div className="space-y-3">{people.map(p=><PersonCard key={p.name} p={p} onClick={()=>{setPerson(p);setScreen('detail')}} />)}</div>
 </div></> }
function PersonCard({p,onClick}){ return <button onClick={onClick} className="w-full bg-white rounded-3xl p-4 shadow-sm text-left border border-slate-100"><div className="flex gap-3"><div className="w-14 h-14 rounded-2xl bg-violet-100 flex items-center justify-center font-bold text-violet-800">{p.avatar}</div><div className="flex-1 min-w-0"><div className="flex justify-between"><b>{p.name}</b><span className="text-emerald-600 text-sm font-bold">{p.match}%</span></div><p className="text-sm text-slate-500">{p.role}</p><p className="text-xs text-slate-500 mt-1">Offre {p.offers} • Cerca {p.wants}</p><div className="mt-2"><TrustLine p={p}/></div><div className="mt-2 flex justify-between"><b className="text-amber-700 text-sm">{p.price}</b><span className="text-xs text-slate-400">{p.fee}</span></div></div></div></button> }

function Onboarding({setScreen}){ return <><Back title="Verification" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><h2 className="text-xl font-semibold">Build trust before exchange</h2><p className="text-sm text-slate-500 mt-2">Il business plan prevede verifica identità, competenze e segnali antifrode prima di scalare il marketplace.</p></Card>{['Email & phone verification','University / student status','Identity document','LinkedIn / portfolio','Skill verification test'].map((x,i)=><Card key={x}><div className="flex justify-between"><b>{x}</b><Pill tone={i<3?'green':'blue'}>{i<3?'Completed':'Optional'}</Pill></div></Card>)}<button onClick={()=>setScreen('match')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Continue to AI Match</button></div></> }
function Match({setScreen,setPerson}){ return <><Back title="AI Matching" setScreen={setScreen}/><div className="px-5 pb-5 space-y-3"><Card className="bg-violet-50"><b>Matching engine</b><p className="text-sm text-slate-600 mt-1">Skill fit + availability + duration + Trust Score + location. Chat completa solo dopo booking.</p></Card>{people.map(p=><PersonCard key={p.name} p={p} onClick={()=>{setPerson(p);setScreen('detail')}} />)}</div></> }
function Detail({person,setScreen}){ return <><Back title="Public profile" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><div className="flex gap-4"><div className="w-20 h-20 rounded-3xl bg-violet-100 flex items-center justify-center text-3xl font-bold text-violet-800">{person.avatar}</div><div><h2 className="text-2xl font-semibold">{person.name}</h2><p className="text-slate-500">{person.role}</p><div className="mt-2"><TrustLine p={person}/></div></div></div><p className="mt-4 text-sm text-slate-600">{person.quote}</p></Card><Card><b>Verified signals</b><div className="mt-3 flex flex-wrap gap-2">{person.verified.map(v=><Pill key={v} tone="green">✓ {v}</Pill>)}</div></Card><Card><b>Stats</b><div className="grid grid-cols-3 gap-2 mt-3 text-center"><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.done}</b><p className="text-[10px] text-slate-500">scambi</p></div><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.completion}</b><p className="text-[10px] text-slate-500">completion</p></div><div className="bg-slate-50 rounded-2xl p-3"><b>{person.stats.response}</b><p className="text-[10px] text-slate-500">response</p></div></div></Card><Card><b>Skills</b><div className="mt-3 flex flex-wrap gap-2">{person.skills.map(s=><Pill key={s}>{s}</Pill>)}</div></Card><div className="grid grid-cols-2 gap-3"><button onClick={()=>setScreen('messages')} className="py-4 rounded-2xl bg-white border font-semibold">Preview chat</button><button onClick={()=>setScreen('booking')} className="py-4 rounded-2xl bg-violet-600 text-white font-semibold">Book & escrow</button></div></div></> }
function Booking({person,setScreen,setBooked}){ return <><Back title="Booking & Escrow" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><div className="flex justify-between"><div><b>{person.name}</b><p className="text-sm text-slate-500">{person.price}</p></div><Pill tone="green">Trust {person.trust}</Pill></div><p className="text-sm mt-3"><Stars/> {person.rating} • {person.stats.done} completed • {person.stats.completion}</p></Card><Card><b>Choose payment</b><div className="grid grid-cols-2 gap-2 mt-3"><button className="rounded-2xl border-2 border-violet-600 p-3"><Theta small/><b>45 Θ</b><p className="text-[10px] text-slate-500">1 Θ = 1 minute</p></button><button className="rounded-2xl border p-3"><div className="text-2xl">€</div><b>Fiat</b><p className="text-[10px] text-slate-500">Hybrid payment</p></button></div></Card><Card className="bg-amber-50"><b>Escrow protection</b><p className="text-sm text-amber-800 mt-1">Theta o fiat vengono bloccati fino al completamento del servizio. Release fondi dopo conferma/review.</p></Card><Card><b>Timeless fee</b><p className="text-sm text-slate-600 mt-1">Marketplace fee 8%. Per scambi premium: 4 Θ per lato. Fee applicabile anche a barter 1h ↔ 1h.</p></Card><button onClick={()=>{setBooked(true);setScreen('chat')}} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Confirm booking & unlock chat</button></div></> }
function Bookings({setScreen}){ return <><Back title="Exchanges" setScreen={setScreen}/><div className="px-5 pb-5 space-y-3"><Card><div className="flex justify-between"><b>Business English</b><Pill tone="green">Escrow locked</Pill></div><p className="text-sm text-slate-500 mt-1">Giulia • Mercoledì 18:00 • 45 Θ</p></Card><Card><div className="flex justify-between"><b>No-code sprint</b><Pill tone="amber">Pending review</Pill></div><p className="text-sm text-slate-500 mt-1">Luca • 60 Θ • Chat attiva</p></Card><button onClick={()=>setScreen('match')} className="w-full py-4 rounded-2xl bg-violet-600 text-white font-semibold">Create new exchange</button></div></> }
function Messages({setScreen,setChat}){ return <><Back title="Messages" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card className="bg-violet-50"><b>Safety rule</b><p className="text-sm text-slate-600 mt-1">La chat completa si sblocca solo dopo la prenotazione, riducendo spam e bypass della piattaforma.</p></Card>{conversations.map(c=><button key={c.name} onClick={()=>{setChat(c);setScreen('chat')}} className="w-full bg-white rounded-3xl p-4 shadow-sm text-left"><div className="flex gap-3 items-center"><div className="w-12 h-12 rounded-2xl bg-violet-100 flex items-center justify-center font-bold text-violet-800">{c.avatar}</div><div className="flex-1"><div className="flex justify-between"><b>{c.name}</b><span className="text-xs text-slate-400">{c.time}</span></div><p className="text-xs text-slate-500">Trust {c.trust}</p><p className="text-sm text-slate-600 truncate">{c.last}</p></div>{c.unread>0&&<span className="w-6 h-6 rounded-full bg-violet-600 text-white text-xs flex items-center justify-center">{c.unread}</span>}</div></button>)}</div></> }
function Chat({chat,setScreen,booked}){ return <><Back title={chat.name} setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card><div className="flex justify-between"><div><b>{chat.name}</b><p className="text-sm text-slate-500">Trust {chat.trust} • Verified</p></div><Pill tone="green">Escrow active</Pill></div></Card><Card className="min-h-[430px] flex flex-col"><p className="rounded-3xl bg-slate-100 p-3 text-sm max-w-[82%]">Ciao Giuseppe, ho visto il tuo booking. Ti mando agenda e materiali.</p><p className="rounded-3xl bg-violet-600 text-white p-3 text-sm mt-3 ml-auto max-w-[82%]">Perfetto, grazie. Confermo mercoledì 18:00.</p><p className="rounded-3xl bg-slate-100 p-3 text-sm mt-3 max-w-[82%]">Dopo la sessione potrai rilasciare review e sbloccare l’escrow.</p><button onClick={()=>setScreen('review')} className="w-full mt-auto py-4 rounded-2xl bg-amber-500 text-white font-semibold">Complete exchange & review</button></Card></div></> }
function Wallet({setScreen}){ return <><Back title="Theta Wallet" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#3f1c8b] to-[#28145e] p-6 text-white text-center"><div className="bg-white rounded-3xl px-3 py-2 inline-block"><Theta/></div><p className="text-sm text-white/70 mt-4">Saldo disponibile</p><h1 className="text-4xl font-bold text-amber-400">128 Θ</h1><p className="text-xs text-white/60 mt-2">1 Θ = 1 minuto. Non pegged to fiat.</p></div><Card><b>Movements</b>{[['+45 Θ','Career mentoring completed'],['-4 Θ','Premium transaction fee'],['-45 Θ','Business English escrow']].map(([a,b])=><div key={b} className="flex justify-between py-3 border-b last:border-b-0"><span className="text-sm text-slate-600">{b}</span><b className={a[0]=='+'?'text-emerald-600':'text-slate-900'}>{a}</b></div>)}</Card></div></> }
function Reputation({setScreen}){ return <><Back title="Trust Score" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><div className="rounded-3xl bg-gradient-to-br from-[#061743] via-[#3f1c8b] to-[#28145e] p-6 text-white text-center"><p className="text-sm text-white/70">Timeless Trust Score</p><div className="mx-auto mt-4 w-36 h-36 rounded-full border-[12px] border-white/20 flex items-center justify-center"><span className="text-4xl font-bold text-amber-400">92</span></div><p className="mt-3"><Stars/> 4.9 (74 reviews)</p><Pill tone="amber">🏆 Expert Member</Pill></div><Card><b>Score breakdown</b>{[['Rating utenti','38/40'],['Storico scambi','24/25'],['Affidabilità','23/25'],['Verifiche','7/10']].map(([a,b])=><div key={a} className="flex justify-between border-b last:border-b-0 py-3 text-sm"><span>{a}</span><b>{b}</b></div>)}</Card></div></> }
function Review({setScreen}){ return <><Back title="Post-service review" setScreen={setScreen}/><div className="px-5 pb-5"><Card><h2 className="text-xl font-semibold">How was the exchange?</h2><p className="text-sm text-slate-500 mt-1">La review aggiorna rating, Trust Score e ranking nel matching AI.</p>{['Qualità','Puntualità','Comunicazione','Professionalità'].map(x=><div key={x} className="flex justify-between items-center mt-5"><span>{x}</span><Stars/></div>)}<textarea className="w-full mt-5 rounded-2xl border p-3 text-sm" rows="4" placeholder="Scrivi una recensione..."/><button onClick={()=>setScreen('reputation')} className="w-full mt-4 py-4 rounded-2xl bg-violet-600 text-white font-semibold">Release escrow & submit review</button></Card></div></> }
function Profile({setScreen}){ return <><Back title="Profile" setScreen={setScreen}/><div className="px-5 pb-5 space-y-4"><Card className="text-center"><div className="w-20 h-20 mx-auto rounded-full bg-violet-100 flex items-center justify-center font-bold text-violet-800">GM</div><h3 className="text-xl font-semibold mt-4">Giuseppe</h3><p className="text-sm text-slate-500">Finance • Mentoring • Markets</p><div className="mt-3 flex justify-center"><Pill tone="green">Trust 92/100</Pill></div><p className="mt-3 text-sm"><Stars/> 4.9 (74)</p></Card><Card><b>Business model signals</b><p className="text-sm text-slate-500 mt-2">Subscription, premium transactions, verification services and marketplace fees can all be layered on this user base.</p></Card></div></> }

function App(){
 const [screen,setScreen]=useState('splash'); const [person,setPerson]=useState(people[0]); const [chat,setChat]=useState(conversations[0]); const [booked,setBooked]=useState(false);
 let page;
 if(screen==='splash') page=<Splash setScreen={setScreen}/>; else if(screen==='home') page=<Home setScreen={setScreen} setPerson={setPerson}/>; else if(screen==='onboarding') page=<Onboarding setScreen={setScreen}/>; else if(screen==='match') page=<Match setScreen={setScreen} setPerson={setPerson}/>; else if(screen==='detail') page=<Detail person={person} setScreen={setScreen}/>; else if(screen==='booking') page=<Booking person={person} setScreen={setScreen} setBooked={setBooked}/>; else if(screen==='bookings') page=<Bookings setScreen={setScreen}/>; else if(screen==='messages') page=<Messages setScreen={setScreen} setChat={setChat}/>; else if(screen==='chat') page=<Chat chat={chat} setScreen={setScreen} booked={booked}/>; else if(screen==='wallet') page=<Wallet setScreen={setScreen}/>; else if(screen==='reputation') page=<Reputation setScreen={setScreen}/>; else if(screen==='review') page=<Review setScreen={setScreen}/>; else page=<Profile setScreen={setScreen}/>;
 return <Shell screen={screen} setScreen={setScreen}>{page}</Shell>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
